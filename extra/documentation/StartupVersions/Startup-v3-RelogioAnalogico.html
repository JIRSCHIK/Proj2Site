
<style>
  .pw { background:#080c10; border-radius:12px; padding:40px 24px; display:flex; align-items:center; justify-content:center; min-height:560px; position:relative; overflow:hidden; }
  .gbg { position:absolute; inset:0; background-image:linear-gradient(#1c2840 1px,transparent 1px),linear-gradient(90deg,#1c2840 1px,transparent 1px); background-size:32px 32px; opacity:.4; pointer-events:none; }
  .rg  { position:absolute; inset:0; background:radial-gradient(ellipse 65% 55% at 50% 50%,rgba(0,102,255,.13) 0%,transparent 70%); pointer-events:none; }
  .bbar { background:#111418; border:1px solid #1c2840; border-bottom:none; border-radius:6px 6px 0 0; padding:10px 14px; display:flex; align-items:center; gap:10px; max-width:460px; width:100%; position:relative; z-index:2; }
  .bdots { display:flex; gap:6px; }
  .bd { width:9px; height:9px; border-radius:50%; }
  .bd.r{background:#ff5f57} .bd.y{background:#febc2e} .bd.g{background:#28c840}
  .addr { flex:1; background:#1a1f28; border-radius:3px; height:20px; display:flex; align-items:center; padding:0 8px; font-family:'Courier New',monospace; font-size:9px; color:#3a5070; letter-spacing:.04em; }
  .card { position:relative; z-index:1; background:#0d1117; border:1px solid #1c2840; border-radius:0 0 4px 4px; padding:32px 44px; text-align:center; max-width:460px; width:100%; }
  .cn  { position:absolute; width:12px; height:12px; border-color:#3a5070; border-style:solid; }
  .tl{top:-1px;left:-1px;border-width:2px 0 0 2px} .tr{top:-1px;right:-1px;border-width:2px 2px 0 0}
  .bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px} .br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
  .lbl { font-family:'Courier New',monospace; font-size:9px; letter-spacing:.22em; color:#3a5070; text-transform:uppercase; margin-bottom:24px; display:flex; align-items:center; justify-content:center; gap:10px; }
  .lbl::before,.lbl::after{content:'';flex:1;height:1px;background:#1c2840}
  .cwrap { display:flex; flex-direction:column; align-items:center; margin-bottom:22px; }
  .dateln { font-family:'Courier New',monospace; font-size:10px; letter-spacing:.16em; color:#607080; text-transform:uppercase; margin-top:12px; }
  .div { width:100%; height:1px; background:linear-gradient(90deg,transparent,#1c2840,transparent); margin:18px 0; }
  .ttl { font-family:'Georgia',serif; font-size:26px; font-weight:700; letter-spacing:.1em; line-height:1.15; color:#fff; text-transform:uppercase; margin-bottom:10px; }
  .ttl span{color:#00e5ff}
  .sub { font-size:12px; color:#607080; letter-spacing:.04em; line-height:1.7; }
  .badge { display:inline-flex; align-items:center; gap:8px; margin-top:20px; padding:5px 14px; border:1px solid rgba(0,229,255,.2); border-radius:2px; font-family:'Courier New',monospace; font-size:9px; letter-spacing:.14em; color:#00e5ff; text-transform:uppercase; }
  .dp { width:7px; height:7px; border-radius:50%; background:#00e5ff; animation:pdp 2s ease-in-out infinite; }
  @keyframes pdp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
  .outer2{display:flex;flex-direction:column;align-items:center;}
</style>

<div class="pw">
  <div class="gbg"></div>
  <div class="rg"></div>
  <div class="outer2">
    <div class="bbar">
      <div class="bdots"><div class="bd r"></div><div class="bd y"></div><div class="bd g"></div></div>
      <div class="addr">localhost:5000 — Meu Site · Projeto 2</div>
    </div>
    <div class="card">
      <span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span>
      <div class="lbl">Sistema Online</div>
      <div class="cwrap">
        <canvas id="clk" width="180" height="180"></canvas>
        <div class="dateln" id="dl">—</div>
      </div>
      <div class="div"></div>
      <div class="ttl">Bem-vindo ao<br><span>Projeto 2</span></div>
      <div class="sub">Novo deploy realizado com sucesso.<br>Ambiente em execução e pronto para uso.</div>
      <div class="badge"><div class="dp"></div>Deploy concluído</div>
    </div>
  </div>
</div>

<script>
const DAYS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function pad(n){return String(n).padStart(2,'0');}
const cv=document.getElementById('clk'),ctx=cv.getContext('2d');
const CX=90,CY=90,R=84;

function draw(){
  const now=new Date();
  const sec=now.getSeconds(),min=now.getMinutes(),hr=now.getHours()%12;
  ctx.clearRect(0,0,180,180);

  // outer ring
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.strokeStyle='#1c2840';ctx.lineWidth=1.5;ctx.stroke();

  // glow ring
  ctx.beginPath();ctx.arc(CX,CY,R-1,0,Math.PI*2);
  ctx.strokeStyle='rgba(0,229,255,.07)';ctx.lineWidth=6;ctx.stroke();

  // ticks
  for(let i=0;i<60;i++){
    const a=(i/60)*Math.PI*2-Math.PI/2,maj=i%5===0;
    const o=R-2,inn=maj?R-14:R-8;
    ctx.beginPath();
    ctx.moveTo(CX+Math.cos(a)*inn,CY+Math.sin(a)*inn);
    ctx.lineTo(CX+Math.cos(a)*o,CY+Math.sin(a)*o);
    ctx.strokeStyle=maj?'#3a5070':'#1c2840';ctx.lineWidth=maj?1.5:.8;ctx.stroke();
  }

  // numbers
  ctx.font='500 9px "Courier New",monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#3a5070';
  for(let i=1;i<=12;i++){
    const a=(i/12)*Math.PI*2-Math.PI/2,nr=R-22;
    ctx.fillText(i,CX+Math.cos(a)*nr,CY+Math.sin(a)*nr);
  }

  // seconds arc
  const sa=(sec/60)*Math.PI*2-Math.PI/2;
  ctx.beginPath();ctx.arc(CX,CY,R-4,-Math.PI/2,sa);
  ctx.strokeStyle='rgba(0,102,255,.35)';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();

  function hand(angle,len,w,color,glow){
    const ex=CX+Math.cos(angle)*len,ey=CY+Math.sin(angle)*len;
    const tx=CX+Math.cos(angle+Math.PI)*12,ty=CY+Math.sin(angle+Math.PI)*12;
    if(glow){ctx.shadowColor=color;ctx.shadowBlur=10;}
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(ex,ey);
    ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();
    ctx.shadowBlur=0;
  }

  hand(((hr+min/60)/12)*Math.PI*2-Math.PI/2,46,3.5,'#cdd9e5',false);
  hand(((min+sec/60)/60)*Math.PI*2-Math.PI/2,64,2,'#cdd9e5',false);
  const sa2=(sec/60)*Math.PI*2-Math.PI/2;
  hand(sa2,72,1,'#00e5ff',true);

  // tail dot
  ctx.beginPath();
  ctx.arc(CX+Math.cos(sa2+Math.PI)*12,CY+Math.sin(sa2+Math.PI)*12,2,0,Math.PI*2);
  ctx.fillStyle='#00e5ff';ctx.shadowColor='#00e5ff';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;

  // center
  ctx.beginPath();ctx.arc(CX,CY,4,0,Math.PI*2);
  ctx.fillStyle='#00e5ff';ctx.shadowColor='#00e5ff';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;

  document.getElementById('dl').textContent=
    DAYS[now.getDay()]+',  '+pad(now.getDate())+' '+MONTHS[now.getMonth()]+' '+now.getFullYear();
}

draw();setInterval(draw,1000);
</script>
