
<style>
  .preview-wrap {
    background: #080c10;
    border-radius: var(--border-radius-lg);
    padding: 40px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 520px;
    position: relative;
    overflow: hidden;
  }
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(#1c2840 1px, transparent 1px),
      linear-gradient(90deg, #1c2840 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: .4;
    pointer-events: none;
  }
  .radial-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(0,102,255,.13) 0%, transparent 70%);
    pointer-events: none;
  }
  .card-preview {
    position: relative;
    z-index: 1;
    background: #0d1117;
    border: 1px solid #1c2840;
    border-radius: 4px;
    padding: 36px 48px;
    text-align: center;
    max-width: 440px;
    width: 100%;
  }
  .corner { position: absolute; width: 12px; height: 12px; border-color: #3a5070; border-style: solid; }
  .tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .top-label {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: .22em;
    color: #3a5070;
    text-transform: uppercase;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .top-label::before, .top-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #1c2840;
  }
  .clock-display {
    font-family: 'Courier New', monospace;
    font-size: 56px;
    line-height: 1;
    letter-spacing: .05em;
    color: #00e5ff;
    text-shadow: 0 0 18px rgba(0,229,255,.5);
    margin-bottom: 8px;
  }
  .colon-blink {
    display: inline-block;
    color: #0066ff;
    animation: blinkc 1s step-start infinite;
  }
  @keyframes blinkc { 0%,49%{opacity:1} 50%,100%{opacity:.15} }
  .date-display {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: .16em;
    color: #607080;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #1c2840, transparent);
    margin: 20px 0;
  }
  .title {
    font-family: 'Georgia', serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: .1em;
    line-height: 1.15;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .title span { color: #00e5ff; }
  .subtitle {
    font-size: 12px;
    color: #607080;
    letter-spacing: .04em;
    line-height: 1.7;
    margin-bottom: 0;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 22px;
    padding: 5px 14px;
    border: 1px solid rgba(0,229,255,.2);
    border-radius: 2px;
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: .14em;
    color: #00e5ff;
    text-transform: uppercase;
  }
  .dot-pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00e5ff;
    animation: pulseD 2s ease-in-out infinite;
  }
  @keyframes pulseD { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.65)} }
  .browser-bar {
    background: #111418;
    border: 1px solid #1c2840;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 440px;
    width: 100%;
    position: relative;
    z-index: 2;
  }
  .browser-dots { display: flex; gap: 6px; }
  .bd { width: 9px; height: 9px; border-radius: 50%; }
  .bd.r { background: #ff5f57; }
  .bd.y { background: #febc2e; }
  .bd.g { background: #28c840; }
  .addr {
    flex: 1;
    background: #1a1f28;
    border-radius: 3px;
    height: 20px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    font-family: 'Courier New', monospace;
    font-size: 9px;
    color: #3a5070;
    letter-spacing: .04em;
  }
  .card-preview { border-radius: 0 0 4px 4px; }
  .outer { display: flex; flex-direction: column; align-items: center; }
</style>

<div class="preview-wrap">
  <div class="grid-bg"></div>
  <div class="radial-glow"></div>

  <div class="outer">
    <div class="browser-bar">
      <div class="browser-dots">
        <div class="bd r"></div>
        <div class="bd y"></div>
        <div class="bd g"></div>
      </div>
      <div class="addr">localhost:5000 — Meu Site · Projeto 2</div>
    </div>

    <div class="card-preview">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

      <div class="top-label">Sistema Online</div>

      <div class="clock-display">
        <span id="ph">00</span><span class="colon-blink">:</span><span id="pm">00</span><span class="colon-blink">:</span><span id="ps">00</span>
      </div>
      <div class="date-display" id="pdate">—</div>

      <div class="divider"></div>

      <div class="title">Bem-vindo ao<br><span>Projeto 2</span></div>
      <div class="subtitle">Novo deploy realizado com sucesso.<br>Ambiente em execução e pronto para uso.</div>

      <div class="badge">
        <div class="dot-pulse"></div>
        Deploy concluído
      </div>
    </div>
  </div>
</div>

<script>
  const DAYS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    const now = new Date();
    document.getElementById('ph').textContent = pad(now.getHours());
    document.getElementById('pm').textContent = pad(now.getMinutes());
    document.getElementById('ps').textContent = pad(now.getSeconds());
    document.getElementById('pdate').textContent =
      DAYS[now.getDay()] + ',  ' + pad(now.getDate()) + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
  }
  tick();
  setInterval(tick, 1000);
</script>
